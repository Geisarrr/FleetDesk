services:
  mysql:
    image: mysql:8.4
    container_name: fleetdesk-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: fleetdesk
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: fleetdesk
      MYSQL_PASSWORD: fleetdesk

    ports:
      - "3306:3306"

    volumes:
      - fleetdesk_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fleetdesk-phpmyadmin
    restart: unless-stopped

    depends_on:
      - mysql

    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306

    ports:
      - "8080:80"

volumes:
  fleetdesk_mysql_data: